# Локальная база PostgreSQL для разработки.
# Значения берутся из файла .env (его создаёт: cp .env.example .env).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Скопируйте .env.example в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Скопируйте .env.example в .env}
      POSTGRES_DB: ${POSTGRES_DB:?Скопируйте .env.example в .env}
    ports:
      # 127.0.0.1 — база доступна только с вашего компьютера, а не из сети
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
